<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
  
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, rgb(73, 139, 73), rgb(72, 72, 198));
      background-repeat: no-repeat;
      font-family: 'Poppins', sans-serif;
    }


    #signupForm {
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 40px 50px;
      width: 330px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    #signupForm::before {
      content: "Create Account";
      text-align: center;
      display: block;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
    }

    input {
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      background: #fff;
      box-shadow: 0 0 6px rgba(72, 72, 198, 0.7);
    }

   
    button {
      background: rgb(72, 72, 198);
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: 0.3s;
    }

    button:hover {
      background: rgb(63, 120, 63);
      transform: scale(1.03);
    }

   .flash-message{
    display: none;
   }


    @media (max-width: 500px) {
      #signupForm {
        width: 85%;
        padding: 30px;
      }
    }
  </style>
</head>

<body>
  <div id="flash-message" class="flash-message"></div>

  <form id="signupForm">
    <input type="text" name="username" placeholder="Username" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>

  <script>
    function showFlashMessage(message,type){
      const flashMessage = document.getElementById("flash-message");
      flashMessage.textContent = message;
      flashMessage.style.display = "block";
      flashMessage.style.position = "fixed";
      flashMessage.style.top = "20px";
      flashMessage.style.left = "50%";
      flashMessage.style.transform = "translateX(-50%)";
      flashMessage.style.padding = "12px 25px";
      flashMessage.style.borderRadius = "8px";
      flashMessage.style.color = "#fff";
      flashMessage.style.fontWeight = "500";
      flashMessage.style.fontSize = "15px";
      flashMessage.style.zIndex = "999";

      if (type === "success") {
        flashMessage.style.backgroundColor = "rgba(46, 204, 113, 0.9)";
      } else {
        flashMessage.style.backgroundColor = "rgba(231, 76, 60, 0.9)";
      }

      setTimeout(() => {
        flashMessage.style.display = "none";
      }, 2000);
    }  
    
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = {
        username: e.target.username.value,
        email: e.target.email.value,
        password: e.target.password.value,
      };


      const response = await fetch("http://localhost:3000/signUp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData),
        credentials: "include"
      });

      const result = await response.json();
      if (response.ok) {


        showFlashMessage(result.message, "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      }
      else {
         showFlashMessage(result.message || "Error logging in", "error");
      }
    });
  </script>
 
  </script>
</body>

</html>
